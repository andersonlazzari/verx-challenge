version: '3.8'

services:
  # 1. Banco de Dados
  postgres:
    image: postgres:15
    container_name: fluxo_caixa_db
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_user
      POSTGRES_DB: fluxo_caixa_dev
    ports:
      - "5432:5432"

  # 2. Mensageria
  rabbitmq:
    image: rabbitmq:3-management
    container_name: fluxo_caixa_mq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  # 3. API de Lançamentos
  lancamentos-api:
    build:
      context: .
      dockerfile: src/services/Lancamentos.API/Dockerfile
    container_name: lancamentos_api
    ports:
      - "5001:8080" 
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=fluxo_caixa_dev;Username=dev_user;Password=dev_user;
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
    depends_on:
      - postgres
      - rabbitmq

  # 4. Worker de Consolidado
  consolidado-worker:
    build:
      context: .
      dockerfile: src/services/Consolidado.Worker/Dockerfile
    container_name: consolidado_worker
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=fluxo_caixa_dev;Username=dev_user;Password=dev_user;
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
    depends_on:
      - postgres
      - rabbitmq

  # 5. API de Consolidado
  consolidado-api:
    build:
      context: .
      dockerfile: src/services/Consolidado.API/Dockerfile
    container_name: consolidado_api
    ports:
      - "5002:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=fluxo_caixa_dev;Username=dev_user;Password=dev_user;
    depends_on:
      - postgres